name: Prototype p2p space acceptance (runner hosts, remote member joins)
on:
  push:
    branches: [proto/iroh-space-acceptance]
permissions:
  contents: read
jobs:
  remote-host:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -c deploy/constraints.txt -e '.[space]' cryptography
      - name: Create p2p space and seal the invitation to the tester's public key
        run: python prototypes/acceptance/remote_host.py setup prototypes/acceptance/home_public.pem
      - uses: actions/upload-artifact@v4
        with:
          name: sealed-invitation
          path: out/invite.enc.json
      - name: Drive the space while the remote member works
        run: python prototypes/acceptance/remote_host.py drive
