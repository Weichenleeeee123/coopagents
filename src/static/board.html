<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Coopagents · 本机看板</title>
<link rel="stylesheet" href="/board/static/styles.css">
<script src="/board/static/delivery.js" defer></script><script src="/board/static/delivery_graph.js" defer></script><script src="/board/static/git.js" defer></script><script src="/board/static/project_activity.js" defer></script><script src="/board/static/dependencies.js" defer></script><script src="/board/static/board.js" defer></script><script src="/board/static/realtime_client.js" defer></script><script src="/board/static/shared_context.js" defer></script><script src="/board/static/capability_discovery.js" defer></script><script src="/board/static/space_board.js" defer></script></head>
<body class="local-board">
<div id="readonly-shell" class="workspace readonly-shell">
<aside id="readonly-sidebar" class="sidebar"><a class="brand" href="/board">Coopagents <span>同频</span></a><div class="room-label"><p class="eyebrow">只读项目空间</p><h2 id="room-name">团队协作</h2><p id="readonly-repository"></p></div><p class="nav-label">当前项目</p><nav id="board-navigation" aria-label="项目工作台"></nav><div class="sidebar-foot"><p>只读查看</p><p>由主机授权的项目会话</p></div></aside>
<main><header class="topline"><button id="readonly-mobile-menu" class="icon-button mobile-menu" type="button" aria-label="项目导航" aria-expanded="false" aria-controls="readonly-sidebar">☰</button><nav class="breadcrumbs" aria-label="当前位置"><span>项目空间</span><span>›</span><span id="readonly-project-name"></span><span>›</span><span id="readonly-crumb-page" aria-current="page">任务</span></nav><div><span id="transport-status" role="status">正在连接…</span><button id="refresh" class="icon-button" aria-label="刷新项目" title="刷新项目" type="button">↻</button></div></header>
<p id="board-error" class="error" role="alert"></p><div class="page-heading"><div><p class="page-project" id="readonly-page-project"></p><h1 id="readonly-view-title">任务</h1><p class="meta">只读项目视图</p></div></div>
<section id="readonly-page-overview" class="readonly-page" hidden></section>
<section id="readonly-page-tasks" class="readonly-page"><nav class="page-tabs" aria-label="任务视图"><button id="readonly-layout-board" type="button" aria-current="page">看板</button><button id="readonly-layout-list" type="button">列表</button></nav><section id="readonly-task-filters" aria-label="任务筛选" class="board-toolbar"><div class="board-tools"><label class="search-label">搜索任务<input id="task-search" type="search" placeholder="标题、范围或进展"></label><label>负责人<select id="task-owner"><option value="">所有成员</option></select></label><label>任务状态<select id="task-status"><option value="active">进行中的任务</option><option value="cancelled">已取消</option><option value="all">全部任务</option></select></label></div><p id="board-count" role="status"></p></section><div id="tasks" class="kanban-board" aria-label="任务看板"></div></section>
<section id="readonly-page-requests" class="readonly-page" hidden><div id="requests"></div></section>
<section id="readonly-page-contracts" class="readonly-page" hidden><nav class="page-tabs" aria-label="共享上下文分类"><button id="readonly-context-agreements" type="button" aria-current="page">约定</button><button id="readonly-context-files" type="button">共享文件</button><button id="readonly-context-records" type="button">共享记录</button></nav><div id="contracts"></div><div id="readonly-assets" hidden></div><div id="shared-context" hidden></div></section>
<section id="readonly-page-context" hidden></section>
<section id="readonly-page-delivery" class="readonly-page" hidden><div id="delivery-traceability"></div></section>
<section id="readonly-page-members" class="readonly-page" hidden><div id="members" hidden></div><div id="capability-discovery"></div></section>
<section id="readonly-page-settings" class="readonly-page" hidden><div id="readonly-settings"></div></section>
<section id="readonly-page-activity" class="readonly-page" hidden><div id="project-activity"></div></section>
<footer class="page-foot"><span>Coopagents / 同频</span></footer>
</main></div>
<dialog id="task-dialog" class="task-dialog drawer" aria-labelledby="task-detail-title"><div class="dialog-heading"><p class="eyebrow">项目详情 · 只读</p><button id="close-task" aria-label="关闭详情" title="关闭详情" type="button">×</button></div><div id="task-detail"></div></dialog></body></html>
