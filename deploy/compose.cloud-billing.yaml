# Opt-in official-cloud account OAuth + fixed monthly Stripe subscription.
# Use with root compose.yaml; no secret values belong in this file.
# docker compose --env-file .env -f compose.yaml -f deploy/compose.cloud-billing.yaml config --quiet
# Account OAuth is separate from the independently optional compose.github.yaml App.
services:
  app:
    environment:
      COOPAGENTS_MODE: cloud
      COOPAGENTS_GITHUB_CLIENT_ID: ${COOPAGENTS_GITHUB_CLIENT_ID:?Set account GitHub OAuth client ID}
      COOPAGENTS_GITHUB_CLIENT_SECRET_FILE: /run/secrets/github_account_oauth
      COOPAGENTS_BILLING_MODE: ${COOPAGENTS_BILLING_MODE:?Set test or live explicitly}
      COOPAGENTS_STRIPE_SECRET_KEY_FILE: /run/secrets/stripe_secret_key
      COOPAGENTS_STRIPE_WEBHOOK_SECRET_FILE: /run/secrets/stripe_webhook_secret
      COOPAGENTS_TEAM_MONTHLY_PRICE_ID: ${COOPAGENTS_TEAM_MONTHLY_PRICE_ID:?Set matching-mode fixed monthly Price ID}
      COOPAGENTS_FREE_MEMBERS: ${COOPAGENTS_FREE_MEMBERS:?Set Free active account member cap}
      COOPAGENTS_FREE_PROJECTS: ${COOPAGENTS_FREE_PROJECTS:?Set Free bound project cap}
      COOPAGENTS_TEAM_MEMBERS: ${COOPAGENTS_TEAM_MEMBERS:?Set Team active account member cap}
      COOPAGENTS_TEAM_PROJECTS: ${COOPAGENTS_TEAM_PROJECTS:?Set Team bound project cap}
    secrets:
      - github_account_oauth
      - stripe_secret_key
      - stripe_webhook_secret
secrets:
  github_account_oauth:
    file: ${COOPAGENTS_GITHUB_CLIENT_SECRET_PATH:?Set protected account OAuth secret file path}
  stripe_secret_key:
    file: ${COOPAGENTS_STRIPE_SECRET_KEY_PATH:?Set protected matching-mode Stripe key file path}
  stripe_webhook_secret:
    file: ${COOPAGENTS_STRIPE_WEBHOOK_SECRET_PATH:?Set protected endpoint signing secret file path}
