[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "coopagents"
version = "0.7.0"
description = "Shared coordination for teammates using their own coding agents"
readme = "README.md"
license = {file = "LICENSE"}
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
integration = ["mcp==2.3.0"]
space = ["mcp==2.3.0", "starlette==1.7.0", "uvicorn==0.54.0", "websockets==17.2", "iroh==1.1.0"]
service = ["mcp==2.3.0", "starlette==1.7.0", "uvicorn==0.54.0", "PyJWT[crypto]==2.15.1", "websockets==17.2"]

[tool.setuptools]
packages = ["coopagents"]
package-dir = { coopagents = "src" }

[tool.setuptools.package-data]
coopagents = ["static/*.html", "static/*.css", "static/*.js", "static/*.png", "skills/coopagents-connect/*.md", "skills/coopagents-space/*.md", "skills/coopagents-space/scripts/*.py"]
