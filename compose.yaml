name: coopagents
services:
  app:
    image: coopagents:${COOPAGENTS_VERSION:-0.9.0}
    build: .
    restart: unless-stopped
    environment:
      COOPAGENTS_MODE: ${COOPAGENTS_MODE:-self-hosted}
      COOPAGENTS_HOST: 0.0.0.0
      COOPAGENTS_PORT: 8787
      COOPAGENTS_DATABASE: ${COOPAGENTS_DATABASE:-/data/coopagents.sqlite3}
      COOPAGENTS_ASSET_MAX_FILE_BYTES: ${COOPAGENTS_ASSET_MAX_FILE_BYTES:-10485760}
      COOPAGENTS_ASSET_MAX_PROJECT_BYTES: ${COOPAGENTS_ASSET_MAX_PROJECT_BYTES:-104857600}
      COOPAGENTS_ASSET_MAX_TOTAL_BYTES: ${COOPAGENTS_ASSET_MAX_TOTAL_BYTES:-1073741824}
      COOPAGENTS_PUBLIC_URL: https://${COOPAGENTS_DOMAIN:?Set COOPAGENTS_DOMAIN in .env}
      COOPAGENTS_BOOTSTRAP_SECRET_FILE: /run/secrets/bootstrap
      COOPAGENTS_TRUSTED_PROXIES: 172.30.87.2
    secrets:
      - bootstrap
    volumes:
      - data:/data
    read_only: true
    tmpfs:
      - /tmp
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    healthcheck:
      test: [CMD, python, -c, "import os,urllib.request; from urllib.parse import urlsplit; r=urllib.request.Request('http://127.0.0.1:8787/ready',headers={'Host':urlsplit(os.environ['COOPAGENTS_PUBLIC_URL']).netloc}); urllib.request.urlopen(r,timeout=5).read()"]
      interval: 30s
      timeout: 6s
      retries: 3
      start_period: 15s
    networks:
      backend:
        ipv4_address: 172.30.87.3
  proxy:
    image: caddy:2.11.2-alpine@sha256:834468128c7696cec0ceea6172f7d692daf645ae51983ca76e39da54a97c570d
    restart: unless-stopped
    environment:
      COOPAGENTS_DOMAIN: ${COOPAGENTS_DOMAIN:?Set COOPAGENTS_DOMAIN in .env}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - certificates:/data
      - proxy_config:/config
    depends_on:
      app:
        condition: service_healthy
    networks:
      backend:
        ipv4_address: 172.30.87.2
networks:
  backend:
    ipam:
      config:
        - subnet: 172.30.87.0/24
volumes:
  data:
  certificates:
  proxy_config:
secrets:
  bootstrap:
    file: ${COOPAGENTS_BOOTSTRAP_FILE:-./.local/bootstrap-secret.txt}
