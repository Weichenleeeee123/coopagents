name: crewmesh
services:
  app:
    image: crewmesh:${CREWMESH_VERSION:-0.3.0rc1}
    build: .
    restart: unless-stopped
    environment:
      CREWMESH_MODE: ${CREWMESH_MODE:-self-hosted}
      CREWMESH_HOST: 0.0.0.0
      CREWMESH_PORT: 8787
      CREWMESH_DATABASE: ${CREWMESH_DATABASE:-/data/crewmesh.sqlite3}
      CREWMESH_PUBLIC_URL: https://${CREWMESH_DOMAIN:?Set CREWMESH_DOMAIN in .env}
      CREWMESH_BOOTSTRAP_SECRET_FILE: /run/secrets/bootstrap
      CREWMESH_TRUSTED_PROXIES: 172.30.87.2
    secrets:
      - bootstrap
    volumes:
      - data:/data
    read_only: true
    tmpfs:
      - /tmp
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    healthcheck:
      test: [CMD, python, -c, "import os,urllib.request; from urllib.parse import urlsplit; r=urllib.request.Request('http://127.0.0.1:8787/ready',headers={'Host':urlsplit(os.environ['CREWMESH_PUBLIC_URL']).netloc}); urllib.request.urlopen(r,timeout=5).read()"]
      interval: 30s
      timeout: 6s
      retries: 3
      start_period: 15s
    networks:
      backend:
        ipv4_address: 172.30.87.3
  proxy:
    image: caddy:2.11.2-alpine@sha256:834468128c7696cec0ceea6172f7d692daf645ae51983ca76e39da54a97c570d
    restart: unless-stopped
    environment:
      CREWMESH_DOMAIN: ${CREWMESH_DOMAIN:?Set CREWMESH_DOMAIN in .env}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - certificates:/data
      - proxy_config:/config
    depends_on:
      app:
        condition: service_healthy
    networks:
      backend:
        ipv4_address: 172.30.87.2
networks:
  backend:
    ipam:
      config:
        - subnet: 172.30.87.0/24
volumes:
  data:
  certificates:
  proxy_config:
secrets:
  bootstrap:
    file: ${CREWMESH_BOOTSTRAP_FILE:-./.local/bootstrap-secret.txt}
